defaults:
  - _self_
  - override hydra/job_logging: none

hydra:
  output_subdir: null
  run:
    dir: .

db:
  postgres_connection_string: postgresql://postgres:postgres@localhost:5432/math_ir

bronze_schema_prefix: bronze
silver_schema_prefix: silver
gold_schema_prefix: gold

bronze_load_formulas: true
bronze_load_posts: true

silver_load_formulas: true
silver_load_posts: true

gold_load_formulas: true

descriptors_load_formula_descriptors: true

silver_load_opt_annotations: true

eval_load_task1: true
eval_load_task2: true

chunk_size: 50000

# Restrict extract-descriptors / annotate-opt / update-silver-posts to the posts
# of this public.dataset id (always in the silver/gold schemas); null = all posts.
dataset_id: 1

paths:
  raw_dir: DEBUG/data_arqmath/formulas
  posts_path: DEBUG/data_arqmath/posts/posts.xml
  arqmath_eval_dir: /home/ma5339/Documents/ARQMath_eval_renamed

formula_sources:
  - table: latex_arqmath
    dir: ${paths.raw_dir}/latex_representation_v3
  - table: slt_arqmath
    dir: ${paths.raw_dir}/slt_representation_v3
  - table: opt_arqmath
    dir: ${paths.raw_dir}/opt_representation_v3

post_sources:
  - table: post_arqmath
    path: ${paths.posts_path}

silver_formula:
  latex_table: latex_arqmath
  p_mathml_table: slt_arqmath
  c_mathml_table: opt_arqmath

silver_post:
  post_table: post_arqmath

descriptors:
  ollama_model: llama3.2:3b
  ollama_gpu: 0
  ollama_port: 11434
  num_ctx: 1024
  write_buffer_size: 50
  limit: null
  overwrite: false
  concurrency: 4
  stale_claim_minutes: 30
  worker_id: null

vocab:
  dataset_id: 1
  comments: null
  overwrite: false
